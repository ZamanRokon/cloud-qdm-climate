[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cloud-qdm-climate"
version = "0.1.0"
description = "Cloud-assisted Quantile Delta Mapping of CMIP6 temperature and precipitation using Earth Engine, Colab, CHIRPS or user-supplied MSWEP."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "ZamanRokon" }]
keywords = [
  "bias-correction",
  "climate-downscaling",
  "cmip6",
  "earth-engine",
  "quantile-delta-mapping",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "PyYAML>=6.0,<7",
  "xarray>=2024.9,<2027",
]

[project.optional-dependencies]
cloud = [
  "dask[array]>=2024.9,<2027",
  "earthengine-api>=1.1,<2",
  "matplotlib>=3.8,<4",
  "netCDF4>=1.6,<2",
  "scipy>=1.11,<2",
  "xee>=0.0.15,<0.1",
  "xclim>=0.57,<0.63",
  "xsdba>=0.6,<0.8",
  "zarr>=2.18,<4",
]
test = [
  "build>=1.2,<2",
  "pre-commit>=4,<5",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "tomli>=2,<3; python_version < '3.11'",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
]

[project.scripts]
qdm = "cloud_qdm.cli:main"

[project.urls]
Documentation = "https://github.com/ZamanRokon/cloud-qdm-climate/tree/main/docs"
Issues = "https://github.com/ZamanRokon/cloud-qdm-climate/issues"
Repository = "https://github.com/ZamanRokon/cloud-qdm-climate"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_qdm"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
