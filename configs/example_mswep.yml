run:
  name: bangladesh-mswep-example
  output_dir: /content/drive/MyDrive/cloud-qdm/outputs

earth_engine:
  project_id: your-earth-engine-project

aoi:
  min_lon: 89.0
  min_lat: 23.0
  max_lon: 93.0
  max_lat: 26.5

calibration:
  start: 1981-01-01
  end: 2014-12-31
  label: calibration

future_windows:
  - start: 2015-01-01
    end: 2040-12-31
    label: near-term
  - start: 2041-01-01
    end: 2070-12-31
    label: mid-century
  - start: 2071-01-01
    end: 2100-12-31
    label: late-century

models:
  - ACCESS-CM2
  - MIROC6

scenarios:
  - ssp245
  - ssp585

precipitation_reference:
  mode: mswep
  path: /content/drive/MyDrive/cloud-qdm/inputs/mswep_daily.nc
  variable: precipitation
  latitude_name: lat
  longitude_name: lon
  time_name: time
  unit_scale: 1.0
  aggregate_to_daily: false

qdm:
  nquantiles: 50
  group: time.month
  wet_day_threshold_mm: 0.1
  adapt_wet_day_frequency: true
  interpolation: linear
  extrapolation: constant

processing:
  earth_engine_chunk_years: 5
  latitude_chunk: 40
  longitude_chunk: 40
  minimum_time_coverage: 0.95
  continue_on_model_error: false
  save_reference_subsets: false
